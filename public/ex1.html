<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- <style>
        *{
            outline: 1px solid red;
        }
    </style> -->
</head>
<body class="min-h-screen flex">
        <div class="grid grid-cols-1 md:grid-cols-2 w-full">
            <!-- Image -->
            <div class="md:block hidden">
                <div class="h-full bg-cover bg-[image:var(--image-login)]"></div>
            </div>
            <!-- Form -->
            <div class=" flex items-center justify-center p-6 md:p-10 bg-white">

            <div class="w-full max-w-md">

                <!-- Signup Form -->
                <form id="signupForm" class="space-y-6 auth-form">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl md:text-3xl font-bold text-neutral-900">Create Account</h1>
                        <p class="mt-2 text-neutral-600 text-sm md:text-base">Join us and get started</p>
                    </div>

                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-neutral-700 mb-1.5">Full Name</label>
                            <input 
                                type="text" 
                                class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition"
                                placeholder="Your name"
                                required
                            />
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-neutral-700 mb-1.5">Email</label>
                            <input 
                                type="email" 
                                class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition"
                                placeholder="name@example.com"
                                required
                            />
                        </div>

                        <div class="relative">
                            <label class="block text-sm font-medium text-neutral-700 mb-1.5">Password</label>
                            <input 
                                type="password" 
                                id="signupPassword"
                                class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition pr-11"
                                placeholder="••••••••"
                                required
                            />
                            <button 
                                type="button"
                                onclick="togglePassword('signupPassword', 'signupEye')"
                                class="absolute right-4 top-[42px] text-neutral-500 hover:text-primary-600"
                            >
                                <i id="signupEye" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button 
                        type="submit"
                        class="w-full mt-6 bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-lg font-medium transition"
                    >
                        Sign Up
                    </button>

                    <p class="text-center text-sm text-neutral-600 mt-6">
                        Already have an account? 
                        <button 
                            type="button"
                            onclick="switchForm('login')"
                            class="text-primary-600 hover:text-primary-700 font-medium"
                        >
                            Log in
                        </button>
                    </p>
                </form>

                <!-- Login Form (hidden by default) -->
                <form id="loginForm" class="space-y-6 auth-form hidden">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl md:text-3xl font-bold text-neutral-900">Log In</h1>
                        <p class="mt-2 text-neutral-600 text-sm md:text-base">Welcome back</p>
                    </div>

                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-neutral-700 mb-1.5">Email</label>
                            <input 
                                type="email" 
                                class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition"
                                placeholder="name@example.com"
                                required
                            />
                        </div>

                        <div class="relative">
                            <label class="block text-sm font-medium text-neutral-700 mb-1.5">Password</label>
                            <input 
                                type="password" 
                                id="loginPassword"
                                class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition pr-11"
                                placeholder="••••••••"
                                required
                            />
                            <button 
                                type="button"
                                onclick="togglePassword('loginPassword', 'loginEye')"
                                class="absolute right-4 top-[42px] text-neutral-500 hover:text-primary-600"
                            >
                                <i id="loginEye" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button 
                        type="submit"
                        class="w-full mt-6 bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-lg font-medium transition"
                    >
                        Log In
                    </button>

                    <p class="text-center text-sm text-neutral-600 mt-6">
                        No account yet? 
                        <button 
                            type="button"
                            onclick="switchForm('signup')"
                            class="text-primary-600 hover:text-primary-700 font-medium"
                        >
                            Sign up
                        </button>
                    </p>
                </form>

            </div>
        </div>
    </div>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        function switchForm(target) {
            document.querySelectorAll('.auth-form').forEach(f => {
                f.classList.add('hidden');
            });
            document.getElementById(target + 'Form').classList.remove('hidden');
        }

        function togglePassword(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }
    </script>
</body>

</html>
